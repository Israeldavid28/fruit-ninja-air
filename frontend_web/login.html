<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Fruit Ninja Air</title>
  <meta name="description" content="Inicia sesión con Google para guardar tus puntajes y aparecer en el ranking de Fruit Ninja Air." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />
  <link rel="stylesheet" href="/estilos/principal.css" />
</head>
<body class="fondo-hero" style="min-height: 100vh; display: flex; flex-direction: column;">

<!-- ── NAVBAR MÍNIMO ───────────────────────────────────── -->
<nav class="navbar">
  <a class="navbar__logo" href="/index.html">
    <span class="navbar__logo-icon">🍊</span>
    <span class="navbar__logo-texto">Fruit Ninja <span>Air</span></span>
  </a>
  <a href="/index.html" class="btn btn-secundario" style="padding: 8px 18px; font-size: 0.75rem; gap: 6px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
    Volver al Inicio
  </a>
</nav>

<!-- ── CONTENIDO CENTRADO ──────────────────────────────── -->
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 24px 40px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%;">

    <!-- Logo grande -->
    <div style="text-align: center;">
      <div style="font-size: 3.5rem; filter: drop-shadow(0 0 20px var(--color-fn-naranja)); animation: flotar 3s ease-in-out infinite; margin-bottom: 8px;">🍊⚔️</div>
      <div class="texto-titulo" style="font-size: 0.65rem; font-weight: 700; color: var(--color-fn-tenue); text-transform: uppercase; letter-spacing: 0.18em;">Fruit Ninja Air</div>
    </div>

    <!-- Card de Login (Estilo Vercel/Jutsu AI adaptado a Fruit Ninja Air) -->
    <div class="mx-auto mt-8 max-w-xl rounded-2xl border bg-black/90 p-8 shadow-[0_18px_50px_rgba(0,0,0,0.45)]" style="border-color: var(--color-fn-borde); background-color: var(--color-fn-panel);">
      <div class="mb-6 text-center">
        <h1 class="texto-titulo mayusculas" style="font-size: 1.8rem; font-weight: 900; color: var(--color-fn-blanco); letter-spacing: 0.06em; margin-bottom: 8px;">
          Acceso Requerido
        </h1>
        <p style="font-size: 0.85rem; color: var(--color-fn-tenue); line-height: 1.5;">
          Bienvenido al Dojo. Inicia sesión para guardar tu puntaje y entrar al ranking en vivo.
        </p>
      </div>

      <!-- Mensaje de error (oculto por defecto) -->
      <div id="mensaje-error" style="display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 0.82rem; text-align: center;"></div>

      <!-- Botones de login -->
      <div style="display: grid; gap: 12px; grid-template-columns: 1fr 1fr;">

        <!-- Discord -->
        <button type="button" id="btn-discord" class="btn btn-discord" style="display: flex; height: 56px; width: 100%; align-items: center; justify-content: center; gap: 12px; border-radius: 12px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.491a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 2.98.078.078 0 0 0 .084-.026c.462-.62.874-1.275 1.226-1.963.021-.04.001-.088-.041-.104a13.201 13.201 0 0 1-1.872-.878.075.075 0 0 1-.008-.125c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.764 8.18 1.764 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.075.075 0 0 1-.006.125c-.598.344-1.22.635-1.873.877a.075.075 0 0 0-.041.105c.36.687.772 1.341 1.225 1.962a.077.077 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-2.981.076.076 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.06.06 0 0 0-.031-.028zM8.02 15.278c-1.182 0-2.157-1.069-2.157-2.38 0-1.312.956-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.956 2.38-2.157 2.38zm7.975 0c-1.183 0-2.157-1.069-2.157-2.38 0-1.312.955-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.946 2.38-2.157 2.38z"/>
          </svg>
          <span style="font-size: 1rem;">Discord</span>
        </button>

        <!-- Google -->
        <button type="button" id="btn-google" class="btn btn-google" style="display: flex; height: 56px; width: 100%; align-items: center; justify-content: center; gap: 12px; border-radius: 12px; background-color: #ffffff; color: #000000;">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span style="font-size: 1rem; font-weight: 600;">Google</span>
        </button>

      </div>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0;">
        <div style="flex: 1; height: 1px; background: var(--color-fn-borde);"></div>
        <span style="font-size: 0.72rem; color: var(--color-fn-tenue); text-transform: uppercase; letter-spacing: 0.08em;">O inicia como</span>
        <div style="flex: 1; height: 1px; background: var(--color-fn-borde);"></div>
      </div>

      <!-- Modo Invitado -->
      <button type="button" id="btn-invitado" class="btn btn-secundario" style="display: flex; height: 56px; width: 100%; align-items: center; justify-content: center; gap: 12px; border-radius: 12px;">
        👤 Invitado (No Ranked)
      </button>

      <!-- Disclaimer -->
      <p style="font-size: 0.72rem; color: var(--color-fn-tenue); text-align: center; margin-top: 24px; line-height: 1.5;">
        Tus puntos están protegidos por nuestro sistema Anti-Cheat. Cero latencia, cero trucos.
      </p>

    </div>

    <!-- Indicador de carga -->
    <div id="cargando" style="display: none; text-align: center;">
      <div style="width: 32px; height: 32px; border: 3px solid var(--color-fn-borde); border-top-color: var(--color-fn-naranja); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px;"></div>
      <p style="font-size: 0.8rem; color: var(--color-fn-tenue);">Verificando credenciales...</p>
    </div>

  </div>
</main>

<style>
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>

<script type="module" src="/src/vistas/login.js"></script>
</body>
</html>
