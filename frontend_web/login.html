<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Frutix</title>
  <meta name="description" content="Crea tu cuenta o inicia sesión para guardar tus puntajes y aparecer en el ranking de Frutix." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />
  <link rel="stylesheet" href="/estilos/principal.css" />
</head>
<body class="fondo-hero" style="min-height: 100vh; display: flex; flex-direction: column;">

<!-- ── NAVBAR MÍNIMO ───────────────────────────────────── -->
<nav class="navbar">
  <a class="navbar__logo" href="/index.html">
    <span class="navbar__logo-icon">🍊</span>
    <span class="navbar__logo-texto">Frutix</span>
  </a>
  <a href="/index.html" class="btn btn-secundario" style="padding: 8px 18px; font-size: 0.75rem; gap: 6px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
    Volver al Inicio
  </a>
</nav>

<!-- ── CONTENIDO CENTRADO ──────────────────────────────── -->
<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 24px 40px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%;">

    <!-- Logo grande -->
    <div style="text-align: center;">
      <div style="font-size: 3.5rem; filter: drop-shadow(0 0 20px var(--color-fn-naranja)); animation: flotar 3s ease-in-out infinite; margin-bottom: 8px;">🍊⚔️</div>
      <div class="texto-titulo" style="font-size: 0.65rem; font-weight: 700; color: var(--color-fn-tenue); text-transform: uppercase; letter-spacing: 0.18em;">Frutix</div>
    </div>

    <!-- Card de Login (adaptado a Frutix) -->
    <div class="mx-auto mt-8 max-w-xl rounded-2xl border bg-black/90 p-8 shadow-[0_18px_50px_rgba(0,0,0,0.45)]" style="border-color: var(--color-fn-borde); background-color: var(--color-fn-panel);">
      <div class="mb-6 text-center">
        <h1 class="texto-titulo mayusculas" style="font-size: 1.8rem; font-weight: 900; color: var(--color-fn-blanco); letter-spacing: 0.06em; margin-bottom: 8px;">
          Acceso Requerido
        </h1>
        <p style="font-size: 0.85rem; color: var(--color-fn-tenue); line-height: 1.5;">
          Bienvenido al Dojo. Inicia sesión para guardar tu puntaje y entrar al ranking en vivo.
        </p>
      </div>

      <!-- Mensaje de error (oculto por defecto) -->
      <div id="mensaje-error" style="display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 0.82rem; text-align: center;"></div>

      <!-- Aviso informativo (ej: confirma tu correo) -->
      <div id="mensaje-aviso" style="display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; font-size: 0.82rem; text-align: center;"></div>

      <!-- Selector Entrar / Crear cuenta -->
      <div id="auth-tabs" role="tablist">
        <button type="button" class="auth-tab activo" data-modo="entrar" role="tab" aria-selected="true">Entrar</button>
        <button type="button" class="auth-tab" data-modo="registro" role="tab" aria-selected="false">Crear cuenta</button>
      </div>

      <!-- Formulario de correo y contraseña -->
      <form id="form-email" novalidate>
        <div id="campo-nombre" class="campo" style="display: none;">
          <label class="campo__label" for="input-nombre">Nombre de ninja</label>
          <input class="campo__input" id="input-nombre" type="text" maxlength="24"
                 autocomplete="nickname" placeholder="Ej: NinjaFrutal" />
        </div>

        <div class="campo">
          <label class="campo__label" for="input-email">Correo electrónico</label>
          <input class="campo__input" id="input-email" type="email" required
                 autocomplete="email" placeholder="tucorreo@ejemplo.com" />
        </div>

        <div class="campo">
          <label class="campo__label" for="input-password">Contraseña</label>
          <input class="campo__input" id="input-password" type="password" required
                 minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres" />
        </div>

        <button type="submit" id="btn-email" class="btn btn-primario"
                style="display: flex; height: 52px; width: 100%; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; margin-top: 4px; font-size: 0.95rem; font-weight: 700;">
          ⚔️ Entrar al Dojo
        </button>
      </form>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0;">
        <div style="flex: 1; height: 1px; background: var(--color-fn-borde);"></div>
        <span style="font-size: 0.72rem; color: var(--color-fn-tenue); text-transform: uppercase; letter-spacing: 0.08em;">O inicia como</span>
        <div style="flex: 1; height: 1px; background: var(--color-fn-borde);"></div>
      </div>

      <!-- Modo Invitado -->
      <button type="button" id="btn-invitado" class="btn btn-secundario" style="display: flex; height: 56px; width: 100%; align-items: center; justify-content: center; gap: 12px; border-radius: 12px;">
        👤 Invitado (No Ranked)
      </button>

      <!-- Disclaimer -->
      <p style="font-size: 0.72rem; color: var(--color-fn-tenue); text-align: center; margin-top: 24px; line-height: 1.5;">
        Tus puntos están protegidos por nuestro sistema Anti-Cheat. Cero latencia, cero trucos.
      </p>

    </div>

    <!-- Indicador de carga -->
    <div id="cargando" style="display: none; text-align: center;">
      <div style="width: 32px; height: 32px; border: 3px solid var(--color-fn-borde); border-top-color: var(--color-fn-naranja); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px;"></div>
      <p style="font-size: 0.8rem; color: var(--color-fn-tenue);">Verificando credenciales...</p>
    </div>

  </div>
</main>

<style>
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Selector Entrar / Crear cuenta ── */
#auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  margin-bottom: 20px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--color-fn-borde);
}
.auth-tab {
  padding: 10px 8px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--color-fn-tenue);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
}
.auth-tab:hover { color: var(--color-fn-claro); }
.auth-tab.activo {
  background: var(--color-fn-naranja);
  color: #0a0a0f;
}

/* ── Campos del formulario ── */
#form-email { display: flex; flex-direction: column; gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo__label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--color-fn-tenue);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.campo__input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--color-fn-borde);
  background: rgba(0, 0, 0, 0.35);
  color: var(--color-fn-blanco);
  font-size: 0.92rem;
  font-family: inherit;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.campo__input::placeholder { color: rgba(255, 255, 255, 0.28); }
.campo__input:focus {
  outline: none;
  border-color: var(--color-fn-naranja);
  box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
}
.campo__input:disabled { opacity: 0.55; cursor: not-allowed; }

@media (max-width: 480px) {
  .mx-auto { width: 100% !important; max-width: 100% !important; padding: 24px 16px !important; }
}
</style>

<script type="module" src="/src/vistas/login.js"></script>
</body>
</html>
